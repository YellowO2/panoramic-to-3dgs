[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panoramic-to-3dgs"
version = "0.1.0"
description = "Convert panoramic images into 3D Gaussian Splat scenes"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "opencv-python",
    "scipy",
    "PyYAML",
    "sharp @ git+https://github.com/apple/ml-sharp.git@1eaa046834b81852261262b41b0919f5c1efdd2e",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["panoramic_to_3dgs*"]
